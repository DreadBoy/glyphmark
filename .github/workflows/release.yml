name: Release

# On every push to main, run typecheck/lint/test/build, then publish any
# package whose version in package.json is not yet on npm. Pushes without a
# version bump still run the quality steps; only the publish is skipped.
#
# Publishing uses npm Trusted Publishing (OIDC): each package on npmjs.com
# lists this repo + workflow as its trusted publisher, and permissions.
# id-token=write lets GitHub mint the OIDC token that npm (>= 11.5.1)
# exchanges for short-lived publish credentials — no NPM_TOKEN secret.
# Provenance attestation (the signed link from tarball to this exact
# workflow run + commit) is generated automatically on OIDC publishes;
# NPM_CONFIG_PROVENANCE=true just keeps it explicit.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Propagate root version to sub-packages
        run: node scripts/set-version-from-root.mjs

      - name: Install dependencies
        run: npm ci

      - name: Check packages (typecheck, lint, test, build)
        env:
          # Pixel goldens are macOS-rendered and drift on Linux rasterization;
          # the pre-commit hook gates screenshots locally instead.
          SKIP_SCREENSHOTS: '1'
        run: npx nx run-many -t typecheck,lint,test,build

      - name: Check whether any package needs publishing
        id: check
        run: |
          set -euo pipefail
          needs_publish=false
          for dir in libs/core apps/cli; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "::notice::$name@$version already on npm — skipping"
            else
              echo "::notice::$name@$version is new — will publish"
              needs_publish=true
            fi
          done
          echo "needs_publish=$needs_publish" >> "$GITHUB_OUTPUT"

      - name: Publish packages whose version is new
        if: steps.check.outputs.needs_publish == 'true'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          publish_if_new() {
            local dir=$1
            local name version
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "::notice::$name@$version already on npm — skipping"
            else
              echo "::notice::publishing $name@$version"
              (cd "$dir" && npm publish --access public)
            fi
          }
          publish_if_new libs/core
          publish_if_new apps/cli
