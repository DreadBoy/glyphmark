name: Release

# On every push to main, three jobs run:
#
#  - check: typecheck, lint, test, and build everything. Screenshots are
#    skipped (SKIP_SCREENSHOTS=1) because the pixel goldens are macOS-rendered
#    and drift on Linux rasterization — the pre-commit hook gates them locally.
#  - publish: gated on check; publishes any package whose version in
#    package.json is not yet on npm. Pushes without a version bump make this
#    job a fast no-op (the registry probe needs no dependencies installed).
#  - plugin: gated on check; cuts a GitHub Release carrying the IntelliJ plugin
#    when no release exists for the root version yet. The same version bump that
#    drives an npm publish drives this, so the two stay in lockstep.
#
# Publishing uses npm Trusted Publishing (OIDC): each package on npmjs.com
# lists this repo + workflow as its trusted publisher, and permissions.
# id-token=write lets GitHub mint the OIDC token that npm (>= 11.5.1,
# bundled with Node 24) exchanges for short-lived publish credentials — no
# NPM_TOKEN secret. Provenance attestation (the signed link from tarball to
# this exact workflow run + commit) is generated automatically on OIDC
# publishes; NPM_CONFIG_PROVENANCE=true just keeps it explicit.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The IntelliJ plugin's tests run through Gradle, which pulls an IDE
      # distribution on first run; `cache: gradle` keeps that to one download.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Check packages (typecheck, lint, test)
        env:
          # Pixel goldens are macOS-rendered and drift on Linux rasterization;
          # the pre-commit hook gates screenshots locally instead.
          SKIP_SCREENSHOTS: '1'
        run: npx nx run-many -t typecheck,lint,test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Reads only the ROOT version (the source of truth a release bumps), so a
      # no-bump push stays a fast no-op — no install needed to decide. Probing
      # before npm ci also lets the install run on the committed, lockfile-
      # consistent state; version propagation happens afterwards.
      - name: Check whether any package needs publishing
        id: check
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          needs_publish=false
          for name in @glyphmark/core @glyphmark/cli; do
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "::notice::$name@$version already on npm — skipping"
            else
              echo "::notice::$name@$version is new — will publish"
              needs_publish=true
            fi
          done
          echo "needs_publish=$needs_publish" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.check.outputs.needs_publish == 'true'
        run: npm ci

      # After npm ci so the install sees a lockfile-consistent tree. This
      # rewrites the sub-package versions (and cli's core dep) to the root
      # version; the lockfile is intentionally not re-synced — nothing runs
      # npm ci again before publish.
      - name: Propagate root version to sub-packages
        if: steps.check.outputs.needs_publish == 'true'
        run: node scripts/set-version-from-root.mjs

      - name: Build packages
        if: steps.check.outputs.needs_publish == 'true'
        run: npx nx run-many -t build

      - name: Publish packages whose version is new
        if: steps.check.outputs.needs_publish == 'true'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          publish_if_new() {
            local dir=$1
            local name version
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "::notice::$name@$version already on npm — skipping"
            else
              echo "::notice::publishing $name@$version"
              (cd "$dir" && npm publish --access public)
            fi
          }
          publish_if_new libs/core
          publish_if_new apps/cli

  plugin:
    name: Release IntelliJ plugin
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Mirrors the npm probe: decide before installing anything, so a push
      # without a version bump costs one API call and nothing else.
      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::notice::v$version already released — skipping"
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v$version is new — will build and release the plugin"
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.check.outputs.needs_release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The Gradle build downloads an IDE distribution on first run; caching
      # ~/.gradle keeps that off the critical path for later releases.
      - name: Set up Java
        if: steps.check.outputs.needs_release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        if: steps.check.outputs.needs_release == 'true'
        run: npm ci

      - name: Propagate root version to the plugin
        if: steps.check.outputs.needs_release == 'true'
        run: node scripts/set-version-from-root.mjs

      # Builds @glyphmark/core and the browser bundle first, via Nx task deps.
      - name: Build plugin
        if: steps.check.outputs.needs_release == 'true'
        run: npx nx build intellij-plugin

      - name: Generate custom plugin repository descriptor
        if: steps.check.outputs.needs_release == 'true'
        run: node scripts/generate-update-plugins-xml.mjs

      # `updatePlugins.xml` is attached to every release, so the stable
      # .../releases/latest/download/updatePlugins.xml URL always resolves to the
      # newest one. That URL is what users add as a custom plugin repository.
      - name: Create release
        if: steps.check.outputs.needs_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "$(cat <<'NOTES'
          ## IntelliJ plugin

          Live `.glyph` preview panel for IntelliJ IDEA 2025.2+.

          **Recommended — install and stay updated:** add this URL under
          <kbd>Settings</kbd> → <kbd>Plugins</kbd> → <kbd>⚙</kbd> → <kbd>Manage Plugin Repositories</kbd>:

          ```
          https://github.com/DreadBoy/glyphmark/releases/latest/download/updatePlugins.xml
          ```

          Then find **Glyphmark** on the Marketplace tab. Updates arrive through the normal IDE flow.

          **One-off:** download the `.zip` below and use
          <kbd>Settings</kbd> → <kbd>Plugins</kbd> → <kbd>⚙</kbd> → <kbd>Install Plugin from Disk…</kbd>.
          The plugin is unsigned, so the IDE shows a warning during installation.
          NOTES
          )" \
            apps/intellij-plugin/build/distributions/*.zip \
            updatePlugins.xml
