name: Release

# On every push to main, run typecheck/lint/test/build, then publish any
# package whose version in package.json is not yet on npm. Pushes without a
# version bump still run the quality steps; only the publish is skipped.
#
# Provenance attestation: NPM_CONFIG_PROVENANCE=true + permissions.id-token=write
# makes GitHub mint an OIDC token that npm verifies, producing a signed
# attestation tying the published tarball to this exact workflow run + commit.
# NPM_TOKEN is still used to authorize the publish itself, until Trusted
# Publishing is configured per package on npmjs.com — at which point the token
# secret can be deleted.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Propagate root version to sub-packages
        run: node scripts/set-version-from-root.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser for tests
        run: npx playwright install --with-deps --only-shell chromium

      - name: Typecheck packages
        run: npx nx run-many -t typecheck -p @glyphmark/core,@glyphmark/cli

      - name: Lint packages
        run: npx nx run-many -t lint -p @glyphmark/core,@glyphmark/cli

      - name: Test packages
        run: npx nx run-many -t test -p @glyphmark/core,@glyphmark/cli

      - name: Build packages
        run: npx nx run-many -t build -p @glyphmark/core,@glyphmark/cli

      - name: Check whether any package needs publishing
        id: check
        run: |
          set -euo pipefail
          needs_publish=false
          for dir in libs/core apps/cli; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "::notice::$name@$version already on npm — skipping"
            else
              echo "::notice::$name@$version is new — will publish"
              needs_publish=true
            fi
          done
          echo "needs_publish=$needs_publish" >> "$GITHUB_OUTPUT"

      - name: Publish packages whose version is new
        if: steps.check.outputs.needs_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          publish_if_new() {
            local dir=$1
            local name version
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "::notice::$name@$version already on npm — skipping"
            else
              echo "::notice::publishing $name@$version"
              (cd "$dir" && npm publish --access public)
            fi
          }
          publish_if_new libs/core
          publish_if_new apps/cli
