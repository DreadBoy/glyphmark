name: Version

# Manually-triggered version bump. Takes the new version as its only input,
# writes it to the ROOT package.json, re-syncs package-lock.json, and commits
# the pair as `bump version to <version>` — the same shape every bump commit in
# this repo's history has.
#
# Only the root package.json is touched on purpose. The sub-package versions
# (libs/core, apps/cli) and the plugin's gradle.properties are deliberate
# placeholders that release.yml rewrites from the root version at publish time
# via scripts/set-version-from-root.mjs; committing them here would just create
# a second source of truth.
#
# The lockfile matters: it embeds the root version, so a bump that skips it
# leaves `npm ci` refusing to install (see commit 5c4a70e, which had to repair
# exactly that drift by hand).
#
# Pushes made with the default GITHUB_TOKEN do NOT trigger other workflows, so
# the bump commit landing on main would not start Release on its own. The last
# step therefore dispatches Release explicitly. Release is idempotent — it
# probes npm and the GitHub releases before doing anything — so a redundant run
# is a cheap no-op.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 1.5.0 (no leading v)'
        required: true
        type: string

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Same semver shape scripts/set-version-from-root.mjs enforces, checked
      # here so a typo fails before anything is written.
      - name: Validate the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$'; then
            echo "::error::\"$VERSION\" is not valid semver (expected e.g. 1.5.0, no leading v)"
            exit 1
          fi
          current=$(node -p "require('./package.json').version")
          if [ "$current" = "$VERSION" ]; then
            echo "::error::package.json is already at $VERSION"
            exit 1
          fi
          echo "::notice::bumping $current -> $VERSION"

      - name: Write the version into the root package.json
        env:
          VERSION: ${{ inputs.version }}
        run: npm pkg set "version=$VERSION"

      # A full install rather than --package-lock-only: release.yml runs
      # `npm ci` against this lockfile, so it needs to be resolved the same way
      # a normal install would resolve it. --no-audit/--no-fund just trim noise.
      - name: Re-sync the lockfile
        run: npm install --no-audit --no-fund

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "::error::nothing to commit — package.json and the lockfile were already at $VERSION"
            exit 1
          fi
          git commit -m "bump version to $VERSION"
          git push origin "HEAD:${{ github.ref_name }}"

      # See the header: the push above cannot trigger Release by itself.
      - name: Trigger Release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main
